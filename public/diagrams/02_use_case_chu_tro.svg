<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" width="1100" height="750">
  
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="2.5" flood-opacity="0.12" flood-color="#0F172A"/>
    </filter>
    <filter id="boxShadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06" flood-color="#0F172A"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706" />
    </marker>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1100" height="750" fill="#F8FAFC" />
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="1100" height="65" fill="url(#headerGrad)" />
  <text x="30" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">BIỂU ĐỒ UML USE CASE - PHÂN HỆ CHỦ TRỌ (OWNER)</text>
  <text x="30" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#E0E7FF">Các chức năng quản trị, thiết lập biểu giá, giám sát và xem báo cáo tài chính</text>

  <!-- Project Badge -->
  <rect x="860" y="16" width="210" height="32" rx="6" fill="#1E293B" fill-opacity="0.4" stroke="#93C5FD" stroke-width="1"/>
  <text x="965" y="36" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">ĐH HOA SEN • OOAD NHÓM 1</text>

  
    <rect x="260" y="85" width="800" height="630" rx="14" fill="#FFFFFF" stroke="#D97706" stroke-width="2" filter="url(#boxShadow)"/>
    <rect x="260" y="85" width="360" height="36" rx="14" fill="#FEF3C7" />
    <text x="280" y="109" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#92400E">PHÂN HỆ QUẢN TRỊ CẤP CAO (CHỦ TRỌ)</text>
  
    <g class="actor" transform="translate(130, 360)">
      <circle cx="0" cy="-28" r="14" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5"/>
      <line x1="0" y1="-14" x2="0" y2="18" stroke="#B45309" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-22" y1="-3" x2="22" y2="-3" stroke="#B45309" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="0" y1="18" x2="-15" y2="46" stroke="#B45309" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="0" y1="18" x2="15" y2="46" stroke="#B45309" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="-85" y="55" width="170" height="34" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
      <text x="0" y="70" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="13" fill="#0F172A">Chủ trọ</text>
      <text x="0" y="84" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748B">👑 Landlord / Owner</text>
    </g>
  
    <g class="use-case">
      <ellipse cx="470" cy="160" rx="120" ry="30" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8" filter="url(#shadow)"/>
      <text x="470" y="157" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1E3A8A">Quản lý tài khoản</text><text x="470" y="173" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1E3A8A">người dùng</text>
    </g>
  
    <g class="use-case">
      <ellipse cx="790" cy="160" rx="110" ry="30" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8" filter="url(#shadow)"/>
      <text x="790" y="157" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1E3A8A">Phân quyền</text><text x="790" y="173" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1E3A8A">vai trò (Roles)</text>
    </g>
  
    <g class="use-case">
      <ellipse cx="470" cy="270" rx="130" ry="30" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8" filter="url(#shadow)"/>
      <text x="470" y="267" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1E3A8A">Thiết lập biểu giá</text><text x="470" y="283" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1E3A8A">(điện, nước, phòng, DV)</text>
    </g>
  
    <g class="use-case">
      <ellipse cx="810" cy="270" rx="125" ry="30" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8" filter="url(#shadow)"/>
      <text x="810" y="267" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1E3A8A">Cấu hình thông tin</text><text x="810" y="283" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1E3A8A">ngân hàng nhận VietQR</text>
    </g>
  
    <g class="use-case">
      <ellipse cx="470" cy="390" rx="130" ry="30" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8" filter="url(#shadow)"/>
      <text x="470" y="387" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1E3A8A">Giám sát sơ đồ &amp;</text><text x="470" y="403" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1E3A8A">Tình trạng phòng</text>
    </g>
  
    <g class="use-case">
      <ellipse cx="810" cy="390" rx="120" ry="30" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8" filter="url(#shadow)"/>
      <text x="810" y="387" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1E3A8A">Theo dõi hoạt động</text><text x="810" y="403" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1E3A8A">vận hành tổng quan</text>
    </g>
  
    <g class="use-case">
      <ellipse cx="470" cy="520" rx="130" ry="30" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8" filter="url(#shadow)"/>
      <text x="470" y="517" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1E3A8A">Xem báo cáo doanh thu,</text><text x="470" y="533" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1E3A8A">tiền đã thu &amp; tồn đọng</text>
    </g>
  
    <g class="use-case">
      <ellipse cx="810" cy="520" rx="120" ry="30" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8" filter="url(#shadow)"/>
      <text x="810" y="517" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1E3A8A">Xuất báo cáo</text><text x="810" y="533" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1E3A8A">ra file (Excel/PDF)</text>
    </g>
  
    <g class="use-case">
      <ellipse cx="470" cy="640" rx="120" ry="28" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8" filter="url(#shadow)"/>
      <text x="470" y="637" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1E3A8A">Đăng nhập hệ thống &amp;</text><text x="470" y="653" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1E3A8A">Đổi mật khẩu</text>
    </g>
  <line x1="190" y1="360" x2="350" y2="160" stroke="#B45309" stroke-width="1.6" /><line x1="190" y1="360" x2="340" y2="270" stroke="#B45309" stroke-width="1.6" /><line x1="190" y1="360" x2="340" y2="390" stroke="#B45309" stroke-width="1.6" /><line x1="190" y1="360" x2="340" y2="520" stroke="#B45309" stroke-width="1.6" /><line x1="190" y1="360" x2="350" y2="640" stroke="#B45309" stroke-width="1.6" />
    <line x1="680" y1="520" x2="600" y2="520" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)" />
    <rect x="602" y="503" width="76" height="18" rx="3" fill="#FFFFFF" fill-opacity="0.9" stroke="#E2E8F0" stroke-width="1"/>
               <text x="640" y="516" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#2563EB">&lt;&lt;extend&gt;&gt;</text>
  
    <line x1="470" y1="190" x2="470" y2="612" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)" />
    <rect x="432" y="384" width="76" height="18" rx="3" fill="#FFFFFF" fill-opacity="0.9" stroke="#E2E8F0" stroke-width="1"/>
               <text x="470" y="397" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#2563EB">&lt;&lt;include&gt;&gt;</text>
  
    <line x1="590" y1="160" x2="680" y2="160" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)" />
    <rect x="597" y="143" width="76" height="18" rx="3" fill="#FFFFFF" fill-opacity="0.9" stroke="#E2E8F0" stroke-width="1"/>
               <text x="635" y="156" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#2563EB">&lt;&lt;include&gt;&gt;</text>
  

  <!-- Footer Watermark -->
  <text x="550" y="738" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94A3B8">Hệ thống Quản lý Căn hộ Dịch vụ &amp; Phòng trọ • Tài liệu Phân tích Thiết kế Hướng Đối Tượng (UML Use Case Specification)</text>
</svg>