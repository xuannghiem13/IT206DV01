<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" width="1100" height="750">
  
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="2.5" flood-opacity="0.12" flood-color="#0F172A"/>
    </filter>
    <filter id="boxShadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06" flood-color="#0F172A"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706" />
    </marker>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1100" height="750" fill="#F8FAFC" />
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="1100" height="65" fill="url(#headerGrad)" />
  <text x="30" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">BIỂU ĐỒ UML USE CASE - CỔNG KHÁCH THUÊ (TENANT PORTAL)</text>
  <text x="30" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#E0E7FF">Các chức năng tự phục vụ của khách thuê: tra cứu phòng, quét mã VietQR và gửi báo hỏng</text>

  <!-- Project Badge -->
  <rect x="860" y="16" width="210" height="32" rx="6" fill="#1E293B" fill-opacity="0.4" stroke="#93C5FD" stroke-width="1"/>
  <text x="965" y="36" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">ĐH HOA SEN • OOAD NHÓM 1</text>

  
    <rect x="260" y="85" width="650" height="630" rx="14" fill="#FFFFFF" stroke="#DB2777" stroke-width="2" filter="url(#boxShadow)"/>
    <rect x="260" y="85" width="370" height="36" rx="14" fill="#FCE7F3" />
    <text x="280" y="109" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#9D174D">CỔNG DỊCH VỤ KHÁCH THUÊ (TENANT PORTAL)</text>
  
    <g class="actor" transform="translate(130, 360)">
      <circle cx="0" cy="-28" r="14" fill="#FCE7F3" stroke="#BE185D" stroke-width="2.5"/>
      <line x1="0" y1="-14" x2="0" y2="18" stroke="#BE185D" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-22" y1="-3" x2="22" y2="-3" stroke="#BE185D" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="0" y1="18" x2="-15" y2="46" stroke="#BE185D" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="0" y1="18" x2="15" y2="46" stroke="#BE185D" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="-85" y="55" width="170" height="34" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
      <text x="0" y="70" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="13" fill="#0F172A">Người thuê căn hộ</text>
      <text x="0" y="84" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748B">🏠 Tenant</text>
    </g>
  
    <g class="bank" transform="translate(1020, 360)">
      <rect x="-70" y="-30" width="140" height="60" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2" filter="url(#shadow)" />
      <text x="0" y="-6" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#B45309" font-weight="600">&lt;&lt;Secondary System&gt;&gt;</text>
      <text x="0" y="11" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#78350F" font-weight="700">Cổng VietQR</text>
      <text x="0" y="24" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#92400E">Napas 24/7</text>
    </g>
  
    <g class="use-case">
      <ellipse cx="460" cy="170" rx="130" ry="30" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.8" filter="url(#shadow)"/>
      <text x="460" y="167" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#831843">Tra cứu thông tin phòng &amp;</text><text x="460" y="183" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#831843">Trang thiết bị bàn giao</text>
    </g>
  
    <g class="use-case">
      <ellipse cx="750" cy="170" rx="120" ry="30" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.8" filter="url(#shadow)"/>
      <text x="750" y="167" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#831843">Xem hợp đồng thuê &amp;</text><text x="750" y="183" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#831843">Thời hạn hợp đồng</text>
    </g>
  
    <g class="use-case">
      <ellipse cx="460" cy="300" rx="130" ry="30" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.8" filter="url(#shadow)"/>
      <text x="460" y="297" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#831843">Xem hóa đơn tiền phòng &amp;</text><text x="460" y="313" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#831843">Chỉ số điện nước định kỳ</text>
    </g>
  
    <g class="use-case">
      <ellipse cx="750" cy="300" rx="120" ry="30" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.8" filter="url(#shadow)"/>
      <text x="750" y="297" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#831843">Thanh toán trực tuyến</text><text x="750" y="313" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#831843">quét mã VietQR động</text>
    </g>
  
    <g class="use-case">
      <ellipse cx="460" cy="450" rx="130" ry="30" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.8" filter="url(#shadow)"/>
      <text x="460" y="447" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#831843">Gửi yêu cầu sửa chữa &amp;</text><text x="460" y="463" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#831843">Báo hỏng thiết bị</text>
    </g>
  
    <g class="use-case">
      <ellipse cx="750" cy="450" rx="120" ry="30" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.8" filter="url(#shadow)"/>
      <text x="750" y="447" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#831843">Theo dõi tiến độ</text><text x="750" y="463" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#831843">thợ kỹ thuật xử lý</text>
    </g>
  
    <g class="use-case">
      <ellipse cx="460" cy="590" rx="130" ry="30" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.8" filter="url(#shadow)"/>
      <text x="460" y="587" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#831843">Xem lịch sử thanh toán &amp;</text><text x="460" y="603" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#831843">Đối soát công nợ</text>
    </g>
  
    <g class="use-case">
      <ellipse cx="750" cy="590" rx="120" ry="30" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.8" filter="url(#shadow)"/>
      <text x="750" y="587" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#831843">Đánh giá chất lượng</text><text x="750" y="603" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#831843">dịch vụ sửa chữa</text>
    </g>
  <line x1="190" y1="360" x2="330" y2="170" stroke="#BE185D" stroke-width="1.6" /><line x1="190" y1="360" x2="330" y2="300" stroke="#BE185D" stroke-width="1.6" /><line x1="190" y1="360" x2="330" y2="450" stroke="#BE185D" stroke-width="1.6" /><line x1="190" y1="360" x2="330" y2="590" stroke="#BE185D" stroke-width="1.6" /><line x1="870" y1="300" x2="950" y2="360" stroke="#D97706" stroke-width="1.6" />
    <line x1="590" y1="300" x2="630" y2="300" stroke="#DB2777" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)" />
