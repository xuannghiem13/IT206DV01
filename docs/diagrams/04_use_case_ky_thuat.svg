  <rect x="0" y="0" width="1100" height="65" fill="url(#headerGrad)" />
  <text x="30" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">BIỂU ĐỒ UML USE CASE - PHÂN HỆ BỘ PHẬN KỸ THUẬT (TECHNICIAN)</text>
  <text x="30" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#E0E7FF">Quy trình tiếp nhận phiếu phân công, thực hiện sửa chữa và ghi nhận vật tư chi phí</text>

  <!-- Project Badge -->
