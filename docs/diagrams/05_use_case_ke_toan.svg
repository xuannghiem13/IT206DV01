  <text x="30" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">BIỂU ĐỒ UML USE CASE - PHÂN HỆ BỘ PHẬN KẾ TOÁN (ACCOUNTANT)</text>
  <text x="30" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#E0E7FF">Quản lý hóa đơn thu tiền, ghi nhận thanh toán VietQR/tiền mặt và báo cáo công nợ</text>

